syntax = "proto3";
package cpaservices.v1;

enum ApplicationStatus {
  APPLICATION_STATUS_UNSPECIFIED = 0;
  APPLICATION_STATUS_APPLIED = 1;
  APPLICATION_STATUS_IN_REVIEW = 2;
  APPLICATION_STATUS_INTERVIEW = 3;
  APPLICATION_STATUS_APPROVED = 4;
  APPLICATION_STATUS_REJECTED = 5;
}

enum PositionStatus {
  POSITION_STATUS_UNSPECIFIED = 0;
  POSITION_STATUS_DRAFT = 1;
  POSITION_STATUS_UPCOMING = 2;
  POSITION_STATUS_OPEN = 3;
  POSITION_STATUS_CLOSED = 4;
}

enum SenderRole {
  SENDER_ROLE_UNSPECIFIED = 0;
  SENDER_ROLE_ADMIN = 1;
  SENDER_ROLE_CANDIDATE = 2;
}

message Position {
  string id = 1;
  string title = 2;
  string department = 3;
  string type = 4;
  PositionStatus status = 5;
  string description = 6;
  int32 openings = 7;
  string created_at = 8;
}

message ListPositionsRequest {
  PositionStatus status_filter = 1;
}

message ListPositionsResponse {
  repeated Position positions = 1;
}

message GetPositionRequest {
  string id = 1;
}

message CreatePositionRequest {
  string title = 1;
  string department = 2;
  string type = 3;
  PositionStatus status = 4;
  string description = 5;
  int32 openings = 6;
}

message UpdatePositionRequest {
  string id = 1;
  string title = 2;
  string department = 3;
  string type = 4;
  PositionStatus status = 5;
  string description = 6;
  int32 openings = 7;
}

message Application {
  string id = 1;
  string candidate_id = 2;
  string position_id = 3;
  ApplicationStatus status = 4;
  string resume_url = 5;
  string applied_at = 6;
  string updated_at = 7;
  string notes = 8;
  string candidate_name = 9;
  string candidate_email = 10;
}

message SubmitApplicationRequest {
  string candidate_id = 1;
  string position_id = 2;
  string resume_url = 3;
  string candidate_name = 4;
  string candidate_email = 5;
  string candidate_phone = 6;
}

message GetApplicationStatusRequest {
  string application_id = 1;
}

message ListMyApplicationsRequest {
  string candidate_id = 1;
}

message ListAllApplicationsRequest {
  ApplicationStatus status_filter = 1;
  string position_id_filter = 2;
}

message ApplicationList {
  repeated Application applications = 1;
}

message Message {
  string id = 1;
  string application_id = 2;
  SenderRole sender_role = 3;
  string sender_id = 4;
  string body = 5;
  string created_at = 6;
}

message SendMessageRequest {
  string application_id = 1;
  SenderRole sender_role = 2;
  string sender_id = 3;
  string body = 4;
}

message GetMessageHistoryRequest {
  string application_id = 1;
}

message MessageList {
  repeated Message messages = 1;
}

message SubscribeMessagesRequest {
  string application_id = 1;
}

message InternTask {
  string id = 1;
  string application_id = 2;
  string title = 3;
  string status = 4;
  string due_date = 5;
  int32 progress = 6;
}

message GetMyTasksRequest {
  string application_id = 1;
}

message TaskList {
  repeated InternTask tasks = 1;
}

message ApproveApplicationRequest {
  string application_id = 1;
  string approved_by = 2;
}

message ApproveApplicationResponse {
  Application application = 1;
  string document_trigger_status = 2;
}

message UpdateApplicationStatusRequest {
  string application_id = 1;
  ApplicationStatus status = 2;
  string notes = 3;
}

service HiringService {
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);
  rpc GetPosition(GetPositionRequest) returns (Position);
  rpc CreatePosition(CreatePositionRequest) returns (Position);
  rpc UpdatePosition(UpdatePositionRequest) returns (Position);
  
  rpc SubmitApplication(SubmitApplicationRequest) returns (Application);
  rpc GetApplicationStatus(GetApplicationStatusRequest) returns (Application);
  rpc ListMyApplications(ListMyApplicationsRequest) returns (ApplicationList);
  rpc ListAllApplications(ListAllApplicationsRequest) returns (ApplicationList);
  rpc UpdateApplicationStatus(UpdateApplicationStatusRequest) returns (Application);
  
  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc GetMessageHistory(GetMessageHistoryRequest) returns (MessageList);
  rpc SubscribeMessages(SubscribeMessagesRequest) returns (stream Message);
  
  rpc GetMyTasks(GetMyTasksRequest) returns (TaskList);
  
  rpc ApproveApplication(ApproveApplicationRequest) returns (ApproveApplicationResponse);
}
